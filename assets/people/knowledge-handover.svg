<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">共同実践で判断理由まで引き継ぐ</title><desc id="desc">業務の引継ぎや熟練技能の継承で、文書にない判断を共有する。 手順書を渡すだけでなく、一緒に実践し判断の理由と例外への対応を確かめる。</desc><rect x="85" y="147" width="1018" height="128" rx="9" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="85" y="461" width="1018" height="128" rx="9" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M356 211H462V383H637V523H832" fill="none" stroke="#2864F0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="853,523 827,511 827,535" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="365" y="309" width="450" height="111" rx="12" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M837 603V663H52V211H64" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="85,211 63,201 63,221" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /></svg>
