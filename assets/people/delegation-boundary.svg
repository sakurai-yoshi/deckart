<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">委ねる判断の範囲と相談する境界を決める</title><desc id="desc">権限委譲で、担当者が判断してよい範囲と相談条件を整理する。 すべてを上位者へ戻さず、合意した範囲は担当者が判断し、境界を超える場合に相談する。</desc><rect x="100" y="165" width="696" height="393" rx="18" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><circle cx="353" cy="386" r="76" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M437 386H583V324H676" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="697,324 673,313 673,335" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M438 425H611V478H853" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="875,478 849,466 849,490" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="877" y="405" width="236" height="145" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /></svg>
