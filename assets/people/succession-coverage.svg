<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">重要な役割と引き継げる人の不足を見つける</title><desc id="desc">後継者計画や業務継続の検討で、特定の人への依存を整理する。 重要な役割ごとに引き継げる人を対応させ、準備が必要な空白を見つける。</desc><rect x="85" y="144" width="327" height="124" rx="10" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><rect x="85" y="362" width="327" height="124" rx="10" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><rect x="736" y="130" width="294" height="102" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><rect x="736" y="316" width="294" height="102" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M420 206H616V181H727M616 206V367H727" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M420 424H600V563H727" fill="none" stroke="#A46A16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><rect x="736" y="510" width="294" height="106" rx="9" fill="#FFFFFF" stroke="#A46A16" stroke-width="3" data-fill-role="paper" data-stroke-role="caution" /></svg>
