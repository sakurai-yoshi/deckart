<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">AIの適用条件から人の確認が必要な例外を分ける</title><desc id="desc">AIを業務へ組み込む際、通常の適用範囲と人が判断する範囲を整理する。 根拠と影響を踏まえた条件を設け、未確認や例外を人の判断へ渡す。</desc><rect x="63" y="271" width="244" height="139" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M315 341L412 341" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="432,341 412,331.8 412,350.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><polygon points="440,341 565,212 690,341 565,470" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" data-fill-role="paper" data-stroke-role="ink" /><path d="M697 341H774V185H875" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="895,185 871,174 871,196" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="899" y="130" width="234" height="110" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M567 474V554H875" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="895,554 871,543 871,565" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="899" y="492" width="234" height="124" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /></svg>
