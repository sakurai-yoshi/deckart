<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">営業の約束と提供側の条件を引き継ぐ</title><desc id="desc">契約後の認識違いを減らすため、提案から導入への引継ぎ内容を整理する。 契約内容だけでなく、顧客の背景や前提を渡し、提供側が条件を確認する。</desc><rect x="81" y="163" width="438" height="342" rx="12" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="681" y="163" width="438" height="342" rx="12" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M402 353L769 353" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="790,353 769,343.34 769,362.66" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M790 432L420 432" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="402,432 420,440.28 420,423.72" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="429" y="311" width="343" height="83" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M298 609V637H898V609" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /></svg>
