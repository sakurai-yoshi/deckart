<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">困りごとを顧客が得たい状態へ言い換える</title><desc id="desc">商品企画や提案で、解決すべき課題と顧客側の成果を整理する。 自社が何を作るかより先に、顧客の行動や状態がどう変わるかを明確にする。</desc><rect x="74" y="226" width="386" height="292" rx="10" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="740" y="226" width="386" height="292" rx="10" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M477 363L689 363" fill="none" stroke="#2864F0" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="720,363 689,348.74 689,377.26" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /></svg>
