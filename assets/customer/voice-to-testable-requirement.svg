<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">顧客の言葉を確認できる要求へ変える</title><desc id="desc">顧客インタビューから製品やサービスの要求を整理する。 顧客の言葉の背景を確かめ、使用場面と確認可能な条件へ具体化する。</desc><path d="M73 141H406V336H297L252 391V336H73Z" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-fill-role="faint" data-stroke-role="ink" /><path d="M426 237L527 237" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="547,237 527,227.8 527,246.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="558" y="148" width="303" height="178" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M864 237H1011V450" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1011,472 1000,447 1022,447" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="560" y="483" width="547" height="132" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /></svg>
