<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">機能から顧客の便益を示し、根拠を添える</title><desc id="desc">営業提案で、機能の説明を顧客にとっての価値へ結びつける。 機能がもたらす便益を示し、その説明を試験や事例などの根拠で支える。</desc><rect x="420" y="124" width="373" height="469" rx="12" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="72" y="266" width="281" height="154" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="865" y="266" width="266" height="154" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M360 341L394 341" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="411,341 394,333.18 394,348.82" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M856 341L821 341" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="804,341 821,348.82 821,333.18" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /></svg>
