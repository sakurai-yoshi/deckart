<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">複数の制約から設計の成立範囲を探す</title><desc id="desc">性能・製造性・寸法などの条件を同時に満たす設計を検討する。 一つの性能だけを最大化せず、条件が重なる範囲から設計案を選ぶ。</desc><rect x="154" y="142" width="904" height="435" rx="4" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><polygon points="211,515 403,203 751,181 1001,427 850,535" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" data-fill-role="pale" data-stroke-role="accent" /><path d="M395 184L698 555M585 154L934 506" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" data-stroke-role="ink" /><polygon points="532,259 682,255 834,443 676,497" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><circle cx="679" cy="375" r="25" fill="#FFFFFF" stroke="none" stroke-width="2" data-fill-role="paper" /><g transform="translate(665 364) scale(0.75)"><path d="M0 12L10 22L32 0" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /></g><path d="M683 496V576" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /></svg>
