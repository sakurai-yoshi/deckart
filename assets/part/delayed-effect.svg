<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">実施から効果が現れるまでの時間を示す</title><desc id="desc">教育や設備投資など、成果が表れるまで時間を要する施策を説明する。 実施直後の状態だけで効果を判断せず、評価する時点を定める。</desc><path d="M38 196L1068 196" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1083,196 1068,189.1 1068,202.9" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><circle cx="195" cy="196" r="12" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M195 146V114H807V146" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" data-stroke-role="mid" /><circle cx="807" cy="196" r="12" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /></svg>
