<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">過去の支出と今後変わる費用を分ける</title><desc id="desc">継続・中止の判断で、支払い済みの費用と選択肢で変わる費用を分ける。 今後の選択によって変わる費用と効果に着目する。</desc><path d="M30 173L1090 173" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M511 42L511 285" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M544 173L1061 173" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1080,173 1061,164.26 1061,181.74" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="29" y="91" width="425" height="65" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /></svg>
