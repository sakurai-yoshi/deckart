<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">直接の効果とその先の影響を分ける</title><desc id="desc">施策の評価で、確認できた効果と波及の仮説を区別する。 取り組みから近い効果と、その先の影響には別の検証が必要になる。</desc><circle cx="122" cy="185" r="49" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M185 185L431 185" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="447,185 431,177.64 431,192.36" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><circle cx="505" cy="185" r="42" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M564 185L880 185" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><polygon points="895,185 880,178.1 880,191.9" fill="#79A7ED" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="mid" /><circle cx="956" cy="185" r="42" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /></svg>
