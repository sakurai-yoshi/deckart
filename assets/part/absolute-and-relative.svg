<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">基準への適合と他者との順位を分ける</title><desc id="desc">目標の達成とランキング上の位置を区別して報告する。 基準を満たすことと、他より上位にあることは別の評価になる。</desc><rect x="33" y="43" width="449" height="261" rx="0" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><rect x="638" y="43" width="449" height="261" rx="0" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /></svg>
