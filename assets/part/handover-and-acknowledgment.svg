<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">引継ぎを受領確認まで閉じる</title><desc id="desc">担当交代や工程間の受け渡しで、相手が受け取ったことまで確かめる。 一方的に渡すだけでなく、受領と理解を返して引継ぎを閉じる。</desc><rect x="32" y="51" width="337" height="232" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="752" y="51" width="336" height="232" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M396 136L708 136" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="723,136 708,129.1 708,142.9" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M723 211L410 211" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="396,211 410,217.44 410,204.56" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /></svg>
