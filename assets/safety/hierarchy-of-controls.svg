<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">危険をなくす対策から優先して検討する</title><desc id="desc">安全対策で、除去・代替・工学的対策・管理的対策・保護具の違いを説明する。 人の注意だけに頼らず、危険そのものや接触する仕組みから対策を考える。</desc><polygon points="65,70 1135,70 1060,161 140,161" fill="#153A6B" stroke="#153A6B" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" data-stroke-role="ink" /><polygon points="155,181 1045,181 970,272 230,272" fill="#2864F0" stroke="#153A6B" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" data-stroke-role="ink" /><polygon points="245,292 955,292 880,383 320,383" fill="#79A7ED" stroke="#153A6B" stroke-width="2" stroke-linejoin="round" data-fill-role="mid" data-stroke-role="ink" /><polygon points="335,403 865,403 790,494 410,494" fill="#E7F0FF" stroke="#153A6B" stroke-width="2" stroke-linejoin="round" data-fill-role="pale" data-stroke-role="ink" /><polygon points="425,514 775,514 700,605 500,605" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" stroke-linejoin="round" data-fill-role="faint" data-stroke-role="ink" /></svg>
