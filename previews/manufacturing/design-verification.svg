<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">要求と設計に対応した検証を行う</title><desc id="desc">要求から設計・試作へ具体化し、それぞれの条件に対応する確認を行う。 作った結果を、事前に決めた要求と設計条件に対応させて確かめる。</desc><rect x="62" y="98" width="274" height="104" rx="9" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><rect x="215" y="285" width="270" height="104" rx="9" fill="#E7F0FF" stroke="#153A6B" stroke-width="3" data-fill-role="pale" data-stroke-role="ink" /><rect x="458" y="504" width="284" height="104" rx="9" fill="#2864F0" stroke="#2864F0" stroke-width="3" data-fill-role="accent" data-stroke-role="accent" /><rect x="715" y="285" width="270" height="104" rx="9" fill="#E7F0FF" stroke="#153A6B" stroke-width="3" data-fill-role="pale" data-stroke-role="ink" /><rect x="864" y="98" width="274" height="104" rx="9" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><path d="M265 210L310.443944 259.295125" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="324,274 317.208186,253.059339 303.679701,265.530911" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M426 402L502.779948 477.936212" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="517,492 509.24929,471.394988 496.310606,484.477436" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M683 492L759.779948 416.063788" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="774,402 753.310606,409.522564 766.24929,422.605012" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M