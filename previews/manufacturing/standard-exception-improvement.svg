<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">例外の学びを標準へ戻す</title><desc id="desc">共通の手順を適用し、標準内で扱えない例外から手順を見直す。 例外を記録して判断し、必要なものだけを標準の改善に生かす。</desc><rect x="86" y="194" width="1028" height="143" rx="12" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="113" y="218" width="250" height="95" rx="9" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M371 265L470 265" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="492,265 470,254.88 470,275.12" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><polygon points="497,265 597,177 697,265 597,353" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" data-fill-role="paper" data-stroke-role="ink" /><path d="M704 265L815 265" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="837,265 815,254.88 815,275.12" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="847" y="218" width="229" height="95" rx="9" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M597 353V462H706" fill="none" stroke="#A46A16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><polygon points="727,462 704,451 704,473" fill="#A46A16" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="caution" /><rect x="737" y="404" width="339" height="119" rx="9" fill="#FFFFFF" stroke="#A46A16" stroke-width="3" data-fill-role="paper" data-stroke-role="caution" /><path d="M906 524V604H239V338" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="239,315 228,340 250,340" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="383" y="562" width="314" height="83" rx="0" fill="#FFFFFF" stroke="#2864F0" stroke-width="2" data-fill-role="paper" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25.07" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="238.0" y="274.274">共通の手順で進む</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="23.307" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="597.0" y="256.843">標準内で</tspan><tspan x="597.0" y="289.472">対応できるか</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="961.5" y="274.95">標準内で完了</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="906.5" y="451.55">例外の理由を記録し</tspan><tspan x="906.5" y="489.35">必要な判断へ渡す</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="772.5" y="182.45">できる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26.68" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="666.0" y="409.838">できない</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26.987" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="539.0" y="612.445">標準を見直すか判断</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="606.0" y="112.45">例外を記録し、再利用できる学びを標準へ戻す</tspan></text></g></svg>
