<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">主張から情報源と加工方法をたどる</title><desc id="desc">集計値や結論に、元の記録と加工方法の二つを対応づける。 出典だけでなく、元の記録をどう結論へ変えたかも追跡できる。</desc><rect x="36" y="41" width="393" height="237" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M429 162H550V89H711M550 162V247H711" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><circle cx="711" cy="89" r="9" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="711" cy="247" r="9" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M735 147L1081 147" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="62" y="95.95">資料中の主張</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="62" y="173.65">根拠までたどれる</tspan><tspan x="62" y="217.05">記述</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="745" y="98.5">元の記録・資料</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="745" y="246.0">集計や判断の方法</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26" font-weight="500