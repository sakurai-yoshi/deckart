<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">指標の分子と分母をそろえる</title><desc id="desc">部門ごとに異なる指標の集計定義をそろえる。 同じ指標名でも対象と分母を明示して比較する。</desc><rect x="25" y="30" width="292" height="238" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M429 149L768 149" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M350 127L392 127" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M350 167L392 167" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="35" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="171.0" y="119.75">初回合格率</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="171.0" y="207.8">単位：％</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="598.5" y="98.15">初回で合格した数</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="598.5" y="220.15">検査した総数</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="42" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="937.5" y="163.7">× 100</tspan></text></g></svg