<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">増減量と増減率を分ける</title><desc id="desc">増減を報告するときに、量の差と元の値に対する割合を区別する。 同じ変化から、差と増減率という別の指標が得られる。</desc><rect x="25" y="28" width="300" height="300" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><path d="M325 177H350M350 95V261M350 95H374M350 261H374" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M739 95L756 95" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="766,95 756,90.4 756,99.6" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M739 261L756 261" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="766,261 756,256.4 756,265.6" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="780" y="28" width="315" height="134" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="780" y="194" width="315" height="134" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25.964" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="48" y="114.087">変更前 → 変更後</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="48" y="240.15">同じ二つの値</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="35" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="558.5" y="112.25">後 − 前</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="558.5" y="271.15">（後 − 前）÷ 前</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="937.5" y="110.55">増減した量</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="937.5" y="272.8">元の値に対する率</tspan></text></g></svg>
