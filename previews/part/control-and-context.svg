<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">変えられることと外部条件を分ける</title><desc id="desc">課題のうち、自分たちで変えられる部分と観測する外部条件を整理する。 直接変えられる範囲へ行動し、外部条件には備える。</desc><circle cx="305" cy="181" r="148" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><circle cx="305" cy="181" r="82" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M661 182L500 182" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><polygon points="487,182 500,187.98 500,176.02" fill="#79A7ED" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="mid" /><rect x="693" y="87" width="381" height="193" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="305.0" y="169.55">直接</tspan><tspan x="305.0" y="207.35">変えられる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="305.5" y="362.6">判断と行動の対象を分ける</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="718" y="142.8">外部の条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="718" y="230.2">観測して備える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="305.0" y="80.4">影響を受ける</tspan></text></g></svg>
