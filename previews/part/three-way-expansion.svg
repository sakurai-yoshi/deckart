<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435" viewBox="0 0 1000 435" role="img" aria-labelledby="title desc"><title id="title">一つの方針を役割別に展開する</title><desc id="desc">方針を担当別の実行内容へ具体化する場面。 同じ方針を、それぞれの役割で実行する。</desc><rect x="28" y="145" width="318" height="142" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M346 216H400M400 82V350M400 82H453M400 216H453M400 350H453" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M478 136L974 136" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M478 270L974 270" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M478 404L974 404" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="187.0" y="225.8">受付方針を共通化</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="478" y="96.15">窓口：案内をそろえる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="478" y="230.15">担当：確認内容をそろえる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="478" y="364.15">管理：記録をそろえる</tspan></text></g></svg>
