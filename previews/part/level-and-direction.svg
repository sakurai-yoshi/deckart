<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">現在の水準と変化の方向を分ける</title><desc id="desc">指標の現状が良くても悪化傾向にある、など二つの見方を添える。 現在の位置と今後につながる変化は別の観点で読む。</desc><path d="M43 252L456 252" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M43 64L43 252" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><rect x="121" y="102" width="205" height="150" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M102 102L346 102" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M647 252L1076 252" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M678 232L1018.323093 93.773534" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1035,87 1015.207267,86.102156 1021.438918,101.444911" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="252.5" y="45.0">今の水準</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="856.5" y="45.0">変化の方向</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="258.0" y="324.85">高いか、低いか</tspan></tex