<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="315" viewBox="0 0 1030 315" role="img" aria-labelledby="title desc"><title id="title">変更前と変更後を一組にする</title><desc id="desc">改善による状態の変化を短く伝える場面。 同じ対象が、どのように変わるかを示す。</desc><rect x="30" y="43" width="410" height="240" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="590" y="43" width="410" height="240" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M469 166L548 166" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="562,166 548,159.56 548,172.44" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="30" y="43" width="410" height="5" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="590" y="43" width="410" height="5" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="58" y="99.4">現在の状態</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="36" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="58" y="181.4">部門ごとに</tspan><tspan x="58" y="231.8">個別の窓口</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="618" y="99.4">変更後の状態</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="36" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="618" y="181.4">共通の受付で</tspan><tspan x="618" y="2