<svg xmlns="http://www.w3.org/2000/svg" width="920" height="264" viewBox="0 0 920 264" role="img" aria-labelledby="title desc"><title id="title">実行前の条件を明示する</title><desc id="desc">提案や手順に、実行の前提を添える場面。 実行前に確認する条件がある。</desc><rect x="28" y="28" width="864" height="208" rx="0" fill="#FFFFFF" stroke="#E7F0FF" stroke-width="2" data-fill-role="paper" data-stroke-role="pale" /><rect x="28" y="28" width="8" height="208" rx="0" fill="#A46A16" stroke="none" stroke-width="2" data-fill-role="caution" /><polygon points="77,63 104,109 50,109" fill="#A46A16" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="caution" /><path d="M77 79L77 92" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /><circle cx="77" cy="100" r="1.8" fill="#FFFFFF" stroke="none" stroke-width="2" data-fill-role="paper" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="126" y="89.15">実行前に確認する条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="126" y="174.65">担当範囲と、判断を戻す条件を合意しておく。</tspan></text></g></svg>
