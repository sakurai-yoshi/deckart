<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="382" viewBox="0 0 1120 382" role="img" aria-labelledby="title desc"><title id="title">利点と必要な負担を並べる</title><desc id="desc">提案の価値と実施に必要な負担を説明する場面。 利点だけでなく、実現の条件も含めて判断する。</desc><rect x="28" y="36" width="492" height="5" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="600" y="36" width="492" height="5" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M560 61L560 238" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><rect x="28" y="275" width="1064" height="79" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="28" y="96.25">得られること</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="28" y="171.0">窓口を統一し、</tspan><tspan x="28" y="213.0">回答の経過を追いやすくする</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="600" y="96.25">必要になること</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="600" y="171.0">引き継ぎの記録と、</tspan><tspan x="600" y="213.0">担当間の調整をそろえる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="54" y="323.65">両方を踏まえて、導入する範囲を決める</tspan></text></g></svg>
