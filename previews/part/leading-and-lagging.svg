<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">先行する行動と結果を分けて測る</title><desc id="desc">目標管理で、今の行動と後で得られる結果を併記する。 結果を待つ間にも、成果へつながる行動を確認できる。</desc><rect x="32" y="55" width="385" height="209" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="707" y="55" width="381" height="209" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><path d="M444 157L666 157" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="681,157 666,150.1 666,163.9" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M457 246H664" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 8" data-stroke-role="mid" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="60" y="107.95">先行指標</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="60" y="179.15">結果につながる</tspan><tspan x="60" y="222.55">行動を確認</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="735" y="107.95">結果指標</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="735" y="179.15">実現した成果を</tspan><tspan x="735" y="222.55">確認</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="570.0" y="313.4">結果が出るまでの時間</tspan></text></g></svg>
