<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">二つの根拠から結論を導く</title><desc id="desc">分析や観察を根拠として、提案を説明する場面。 複数の根拠が一つの結論を支える。</desc><path d="M30 142L438 142" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M30 286L438 286" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M454 110H480V258H454M480 184H516" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M518 184L554 184" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="566,184 554,178.48 554,189.52" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="588" y="72" width="482" height="244" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="588" y="72" width="482" height="8" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="30" y="64.4">根拠 A</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="30" y="119.45">窓口が部門ごとに分かれる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="30" y="212.4">根拠 B</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="30" y="267.45">問い合わせを何度も転送する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="622" y="137.4">導かれる結論</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="622" y="212.1">最初の受付を</tspan><tspan x="622" y="259.7">一つにそろえる</tspan></text></g></svg>
