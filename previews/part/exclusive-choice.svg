<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">同時に選ばない選択肢を区別する</title><desc id="desc">方針や運用方式のうち、一つを選んで進める場面を説明する。 両方を同時に実行するのではなく、どちらかを選ぶ。</desc><rect x="30" y="104" width="294" height="159" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M324 183H395M395 84V283M395 84H497M395 283H497" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><circle cx="537" cy="84" r="23" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="537" cy="283" r="23" fill="#FFFFFF" stroke="#607590" stroke-width="3" data-fill-role="paper" data-stroke-role="muted" /><rect x="590" y="32" width="501" height="108" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="590" y="231" width="501" height="108" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="177.0" y="171.65">いずれかを</tspan><tspan x="177.0" y="215.05">選ぶ</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="616" y="97.55">選択した方針</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="616" y="294.8">同時には採用しない方針</tspan></text></g></svg>
