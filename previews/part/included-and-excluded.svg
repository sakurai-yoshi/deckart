<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="295" viewBox="0 0 1040 295" role="img" aria-labelledby="title desc"><title id="title">囲った対象と対象外を区別する</title><desc id="desc">説明の対象を短く区切って共有する場面。 括った対象だけを今回の範囲として扱う。</desc><path d="M29 249V41H638V249" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M55 119L612 119" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M702 42L702 266" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><rect x="742" y="43" width="270" height="54" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="56" y="91.45">今回、見直す範囲</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="56" y="206.05">受付・確認依頼・経過連絡</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="877.0" y="78.25">対象外</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="742" y="181.2">価格の決裁</tspan><tspan x="742" y="220.4">契約内容の変更</tspan></text></g></svg>
