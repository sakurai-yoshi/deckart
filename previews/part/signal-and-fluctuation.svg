<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">短期の揺らぎと継続する変化を読み分ける</title><desc id="desc">短期間の上下を過大評価せず、継続する変化を説明する。 日々の揺らぎと、同じ条件で続く方向を分けて読む。</desc><path d="M45 191L91 126L137 205L183 113L229 192L275 98L321 176L367 79L413 159L459 63" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M45 179L459 98" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M487 168L616 168" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="631,168 616,161.1 616,174.9" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M670 238L1063 116" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M665 268L1081 268" fill="none" stroke="#153A6B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="254.0" y="54.65">日々の揺らぎと変化</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="879.0" y="58.65">継続している方向</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="257.5" y="326.95">短い変動だけで判断しない</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="876.5" y="326.95">期間と条件をそろえて読む</tspan></text></g></svg>
