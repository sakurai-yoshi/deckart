<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">固定費と数量に応じる費用を分ける</title><desc id="desc">原価や収益構造で、数量が変わったときの影響を説明する。 数量によらない費用と、一単位ごとに発生する費用を足して考える。</desc><rect x="29" y="53" width="377" height="225" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="598" y="53" width="142" height="225" rx="0" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><rect x="775" y="53" width="142" height="225" rx="0" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><rect x="951" y="53" width="142" height="225" rx="0" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><path d="M460 146L543 146" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M502 105L502 187" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="54" y="112.3">固定する部分</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="54" y="203.3">数量によらない費用</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="845.0" y="333.8">数量に応じて増減する部分</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="669.5" y="156.25">単位</tspan><tspan x="669.5" y="191.25">当たり</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="845.5" y="156.25">単位</tspan><tspan x="845.5" y="191.25">当たり</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1021.5" y="156.25">単位</tspan><tspan x="1021.5" y="191.25">当たり</tspan></text></g></svg>
