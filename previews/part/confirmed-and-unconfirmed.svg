<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="286" viewBox="0 0 1080 286" role="img" aria-labelledby="title desc"><title id="title">確認済みと未確認を区別する</title><desc id="desc">調査の進み具合や根拠の確かさを共有する場面。 分かっていることと、まだ分からないことを区別する。</desc><rect x="28" y="36" width="470" height="216" rx="0" fill="#FFFFFF" stroke="#153A6B" stroke-width="2" data-fill-role="paper" data-stroke-role="ink" /><path d="M580 36H1050V252H580Z" fill="none" stroke="#607590" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" data-stroke-role="muted" /><circle cx="65" cy="72" r="12" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(58 64) scale(0.45)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><circle cx="617" cy="72" r="12" fill="#FFFFFF" stroke="#607590" stroke-width="2" data-fill-role="paper" data-stroke-role="muted" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="94" y="79.25">確認できたこと</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="55" y="162.8">記録の形式が</tspan><tspan x="55" y="207.6">担当ごとに異なる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="646" y="79.25">これから確かめること</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="607" y="162.8">形式の違いが</tspan><tspan x="607" y="207.6">対応時間へ与える影響</tspan></text></g></svg>
