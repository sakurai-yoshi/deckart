<svg xmlns="http://www.w3.org/2000/svg" width="995" height="325" viewBox="0 0 995 325" role="img" aria-labelledby="title desc"><title id="title">実行する人と判断する人を分ける</title><desc id="desc">仕事の担当と判断権限を短く確認する場面。 手を動かす人と、決める人を区別する。</desc><rect x="28" y="33" width="938" height="66" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M497 124L497 296" fill="none" stroke="#E7F0FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><rect x="56" y="127" width="86" height="5" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="549" y="127" width="86" height="5" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#FFFFFF" data-fill-role="paper"><tspan x="56" y="76.15">対応方針を確定する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="56" y="187.75">案を作る人</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="56" y="264.55">運用を担う担当者</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="549" y="187.75">判断する人</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="549" y="264.55">責任を持つ管理者</tspan></text></g></svg>
