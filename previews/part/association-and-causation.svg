<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">一緒に動くことと原因であることを区別する</title><desc id="desc">分析結果で、二つの値の関係をそのまま原因と断定しないために添える。 相関を観測しても、原因であるかは別途検証する。</desc><rect x="30" y="57" width="410" height="218" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="687" y="57" width="404" height="218" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M483 145L637 145" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M483 185L637 185" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M533 213L587 117" fill="none" stroke="#A46A16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="57" y="115.15">一緒に変わっている</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="57" y="215.55">相関が見られる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="715" y="115.15">変化を引き起こした</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="715" y="215.55">原因を確かめる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="560.5" y="340.95">つながりの有無と原因の検証は別</tspan></text></g></svg>
