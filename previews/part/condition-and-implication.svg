<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="305" viewBox="0 0 1000 305" role="img" aria-labelledby="title desc"><title id="title">条件が成立した場合の意味を示す</title><desc id="desc">提案の効果がどんな条件で成立するかを説明する場面。 この前提が満たされる場合に、下の内容が成り立つ。</desc><rect x="28" y="38" width="116" height="52" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M164 114L964 114" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M86 108V204H196" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="211,204 192,195 192,213" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="234" y="145" width="730" height="126" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="86.0" y="72.75">前提</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="182" y="78.2">受付情報を全担当が参照できる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="262" y="219.35">担当が変わっても、説明を引き継げる</tspan></text></g></svg>
