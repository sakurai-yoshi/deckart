<svg xmlns="http://www.w3.org/2000/svg" width="940" height="200" viewBox="0 0 940 200" role="img" aria-labelledby="title desc"><title id="title">区分と話題を二段で示す</title><desc id="desc">一つの区分の中で、細かな話題を整理する場面。 上位の区分と、この箇所の話題を同時に示す。</desc><rect x="28" y="29" width="7" height="142" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M67 171L912 171" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="67" y="53.4">現状把握</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="37" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="67" y="132.45">部門をまたぐ箇所に注目する</tspan></text></g></svg>
