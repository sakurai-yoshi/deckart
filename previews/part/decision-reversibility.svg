<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">判断を戻せるかで検証の厚さを変える</title><desc id="desc">判断の影響に応じて、試行と事前検証の進め方を説明する。 元へ戻す負担が大きい判断ほど、実行前に検証する。</desc><path d="M65 143L437 143" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="453,143 437,135.64 437,150.36" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M443 164V237H77V164" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="77,151 69,167 85,167" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M651 143L1041 143" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1057,143 1041,135.64 1041,150.36" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="62" y="84.9">戻せる判断</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="62" y="325.65">試してから調整する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="649" y="82.8">戻すコストが大きい判断</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="649" y="325.65">事前の検証を厚くする</tspan></text></g></svg>
