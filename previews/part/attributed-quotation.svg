<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="315" viewBox="0 0 1030 315" role="img" aria-labelledby="title desc"><title id="title">発言と出典を一組にする</title><desc id="desc">インタビューや発言を本文の中へ引用する場面。 発言そのものと、その情報源を一緒に示す。</desc><path d="M28 105V74C28 43 48 27 81 27V50C63 50 56 57 56 73H84V121H28Z" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-fill-role="accent" /><path d="M101 105V74C101 43 121 27 154 27V50C136 50 129 57 129 73H157V121H101Z" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-fill-role="accent" /><path d="M208 211L998 211" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="208" y="90.1">同じことを、何度も説明しないで</tspan><tspan x="208" y="137.7">済むようにしてほしい。</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="208" y="265.9">発言者・聞き取り日・引用元</tspan></text></g></svg>
