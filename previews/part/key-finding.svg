<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">最も伝えたい示唆を抜き出す</title><desc id="desc">分析から得た一つの示唆を強調する場面。 この一文が説明の要点である。</desc><rect x="28" y="34" width="116" height="44" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M172 57L972 57" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><rect x="28" y="119" width="7" height="132" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="86.0" y="64.4">示唆</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="43" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="65" y="171.45">案内を増やすより、</tspan><tspan x="65" y="231.65">窓口のつながりを整える。</tspan></text></g></svg>
