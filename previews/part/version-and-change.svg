<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">参照した版と今回の変更を対応づける</title><desc id="desc">規定や仕様の改訂で、どの版から何が変わったかを添える。 元の版と適用する版を明示して、差分を確認する。</desc><rect x="34" y="53" width="372" height="237" rx="0" fill="#F3F7FD" stroke="#79A7ED" stroke-width="2" data-fill-role="faint" data-stroke-role="mid" /><rect x="711" y="53" width="374" height="237" rx="0" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M434 168L666 168" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="682,168 666,160.64 666,175.36" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="60" y="106.45">参照した版</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="60" y="208.2">版番号・適用日</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="737" y="106.45">今回の版</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="737" y="208.2">変更点と適用日</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="560.0" y="337.75">差