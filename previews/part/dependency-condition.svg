<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="364" viewBox="0 0 1100 364" role="img" aria-labelledby="title desc"><title id="title">着手前に必要な条件を示す</title><desc id="desc">遅延や着手待ちの理由を工程の近くに注記する。 先行条件を満たすまで後続作業を進めない。</desc><rect x="29" y="43" width="338" height="190" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="695" y="43" width="370" height="190" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M386 135L509 135" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><rect x="526" y="65" width="14" height="140" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M563 135L656 135" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="674,135 656,126.72 656,143.28" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><circle cx="533" cy="258" r="17" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M533 240V205" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="54" y="95.75">先に必要なこと</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29.44" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="54" y="180.304">検査条件を確定する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="720" y="95.75">条件を満たして着手</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="720" y="180.5">量産の試行を始める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="533.0" y="330.95">ここが未完了なら、着手を待つ</tspan></text></g></svg>
