<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="290" viewBox="0 0 1040 290" role="img" aria-labelledby="title desc"><title id="title">仮説と確かめ方を一組にする</title><desc id="desc">調査前に何をどう確かめるかを共有する場面。 仮説を事実と分け、検証の方法を示す。</desc><path d="M30 255V35H468V255Z" fill="none" stroke="#153A6B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" data-stroke-role="ink" /><path d="M490 145L538 145" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="550,145 538,139.48 538,150.52" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="572" y="34" width="438" height="222" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="55" y="90.25">確かめたい仮説</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="55" y="165.65">引き継ぎの回数が</tspan><tspan x="55" y="209.05">回答を遅らせている</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="596" y="90.25">確かめる方法</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="596" y="165.65">案件の記録から</tspan><tspan x="596" y="209.05">経路と時間を調べる</tspan></text></g></svg>
