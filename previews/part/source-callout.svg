<svg xmlns="http://www.w3.org/2000/svg" width="810" height="280" viewBox="0 0 810 280" role="img" aria-labelledby="title desc"><title id="title">参照箇所と補足をつなぐ</title><desc id="desc">グラフや図の一箇所に、読み取り条件と出典を添える場面。 指した箇所の条件と情報源を確認できる。</desc><circle cx="32" cy="198" r="9" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M42 198H104V98H157" fill="none" stroke="#2864F0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M157 44L157 242" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M185 136L772 136" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="185" y="88.2">対象：既存の契約企業</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="185" y="197.75">出典：顧客調査の集計表</tspan></text></g></svg>
