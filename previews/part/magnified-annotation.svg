<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="330" viewBox="0 0 1060 330" role="img" aria-labelledby="title desc"><title id="title">一箇所を選び説明を拡大する</title><desc id="desc">図面や表の一箇所について詳しく説明する。 右側の補足が元資料のどの箇所についてのものか分かる。</desc><rect x="28" y="59" width="354" height="233" rx="0" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><path d="M70 117L337 117" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M70 170L337 170" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M70 224L337 224" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><circle cx="241" cy="170" r="56" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><path d="M205 170L277 170" fill="none" stroke="#2864F0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M291 144L513 82M291 196L513 270" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" data-stroke-role="mid" /><rect x="521" y="47" width="504" height="251" rx="0" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><rect x="521" y="47" width="8" height="251" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="35" y="34.75">資料内の確認箇所</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="562" y="114.5">拡大して確認する内容</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="562" y="198.95">変更した条件と、</tspan><tspan x="562" y="245.15">その理由を読み取る</tspan></text></g></svg>
