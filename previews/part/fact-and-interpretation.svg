<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="300" viewBox="0 0 1030 300" role="img" aria-labelledby="title desc"><title id="title">事実と解釈を分けて置く</title><desc id="desc">観察や調査結果から示唆を述べる場面。 見つかった事実と、それをどう読んだかを区別する。</desc><rect x="28" y="36" width="447" height="6" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="555" y="36" width="447" height="6" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M515 75L515 266" fill="none" stroke="#E7F0FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="28" y="99.1">観測した事実</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="28" y="185.45">同じ案件で、</tspan><tspan x="28" y="231.65">複数回の転送があった</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="555" y="99.1">そこからの読み取り</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="555" y="186.5">窓口間で、</tspan><tspan x="555" y="228.5">情報が途切れている可能性</tspan></text></g></svg>
