<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">前提の変化が結論へ与える影響を確かめる</title><desc id="desc">見積もりや計画で、どの前提を重点的に確認するか説明する。 前提を変えたときの結果の動きから、重要な条件を見つける。</desc><rect x="29" y="69" width="294" height="215" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><circle cx="563" cy="175" r="65" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M323 174H484M639 174H716M716 174V78H770M716 174V276H770" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M795 130L1081 130" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M795 328L1081 328" fill="none" stroke="#E7F0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="52" y="132.8">前提を動かす</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="52" y="228.95">価格・量・条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="563.0" y="185.6">再計算</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="798" y="87.45">結果が大きく変わる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Ka