<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">共通の土台と用途ごとの差を分ける</title><desc id="desc">標準化の対象と個別に残す違いを説明する。 土台を共通にしながら、用途に必要な違いを持たせる。</desc><rect x="32" y="220" width="1055" height="84" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="90" y="91" width="249" height="129" rx="0" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="435" y="62" width="249" height="158" rx="0" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="780" y="109" width="249" height="111" rx="0" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="559.0" y="270.7">共通して使う土台</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="214.5" y="145.35">用途 A の</tspan><tspan x="214.5" y="185.95">違い</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="559.5" y="126.35">用途 B の</tspan><tspan x="559.5" y="166.95">違い</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25.185" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="904.5" y="169.315">用途 C の違い</tspan></text></g></svg>
