<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="250" viewBox="0 0 1030 250" role="img" aria-labelledby="title desc"><title id="title">用語と定義を対応させる</title><desc id="desc">専門用語や社内用語を初めて説明する場面。 この資料での言葉の意味をそろえる。</desc><rect x="28" y="36" width="302" height="178" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><path d="M369 40L369 210" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="42" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="179.0" y="138.2">一次回答</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="410" y="87.4">用語の意味</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="410" y="150.35">受付後、最初に行う案内や回答。</tspan><tspan x="410" y="190.95">最終的な解決とは分けて扱う。</tspan></text></g></svg>
