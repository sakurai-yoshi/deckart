<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">一度の費用と繰り返す費用を分ける</title><desc id="desc">導入案の費用を、準備時の支出と利用期間中の支出に分けて見積もる。 導入時だけでなく、利用を続ける期間の費用も含めて評価する。</desc><rect x="30" y="65" width="350" height="220" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><path d="M450 186L520 186" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M485 151L485 221" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><rect x="612" y="147" width="142" height="88" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="776" y="147" width="142" height="88" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="940" y="147" width="142" height="88" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M758 191L766 191" fill="none" stroke="#2864F0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="772,191 766,188.24 766,193.76" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M922 191L930 191" fill="none" stroke="#2864F0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="936,191 930,188.24 930,193.76" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M30 297V313H1091V297" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="58" y="123.0">一度だけ発生</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="58" y="218.95">準備・導入時の費用</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="846.0" y="107.5">利用期間ごとに発生</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="683.0" y="199.45">運用費</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="847.0" y="199.45">運用費</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="1011.0" y="199.45">運用費</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="560.0" y="359.3">初期費用と継続費用を合計する</tspan></text></g></svg>
