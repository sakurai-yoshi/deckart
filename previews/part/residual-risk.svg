<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">対策後に残るリスクも確認する</title><desc id="desc">対策を実施した後に残るリスクの扱いを説明する。 対策の実施後にも残る影響と発生可能性を確認する。</desc><rect x="30" y="64" width="416" height="222" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><path d="M470 175L657 175" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="674,175 657,167.18 657,182.82" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="701" y="64" width="390" height="222" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="58" y="123.15">対策前のリスク</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="58" y="218.0">影響と起きやすさ</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="728" y="122.8">対策後に残るリスク</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="728" y="217.3">受容と監視を決める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="573.0" y="106.6">対策を実施</tspan></text></g></svg>
