<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-labelledby="title desc"><title id="title">結果を次の試行へ戻す</title><desc id="desc">試行結果を次の改善につなぐ場面。 確認して終えず、課題を次の運用へ戻す。</desc><rect x="34" y="40" width="336" height="138" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="632" y="40" width="334" height="138" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M392 109L596 109" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="610,109 596,102.56 596,115.44" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M800 178V250H205V199" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="205,182 197,202 213,202" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="202.0" y="119.2">運用を試す</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="32" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="799.0" y="119.2">結果を確認する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="330" y="303.75">確認した課題を、次の試行へ戻す</tspan></text></g></svg>
