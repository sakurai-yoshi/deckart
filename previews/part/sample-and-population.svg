<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">調べた範囲と対象全体を分ける</title><desc id="desc">アンケートや抜取検査の結果に、標本と母集団の関係を添える。 実際に調べた一部と、判断したい全体の範囲を区別する。</desc><rect x="31" y="34" width="620" height="258" rx="0" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><rect x="335" y="84" width="269" height="159" rx="0" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M604 165H737V89H787" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><circle cx="604" cy="165" r="7" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="57" y="82.65">母集団</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="57" y="212.15">調べたい全体</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="470.0" y="150.35">実際に調べた</tspan><tspan x="470.0" y="190.95">範囲</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="791" y="92.65">抽出方法を併記</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="791" y="195.7">結果をどこまで</tspan><tspan x="791" y="234.9">広げて解釈するか</tspan></text></g></svg>
