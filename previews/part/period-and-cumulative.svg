<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">期間内の値と開始からの累計を分ける</title><desc id="desc">月次報告で、その月の実績と年度累計を読み分ける。 期間値は一区間、累計値は開始からの合計を表す。</desc><path d="M38 142L1080 142" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M70 123L70 161" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M300 123L300 161" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M530 123L530 161" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M760 123L760 161" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M990 123L990 161" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><rect x="762" y="86" width="225" height="55" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M70 208V249H990V208" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M762 71V39H990V71" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="866.0" y="27.4">今回の期間に発生した分</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="529.0" y="307.35">開始から今回までを足した累計</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="31" y="200.4">集計の開始</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#607590" data-fill-role="muted"><tspan x="940.5" y="200.4">今回の期間の終わり</tspan></text></g></svg>
