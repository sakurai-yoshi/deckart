<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="330" viewBox="0 0 1070 330" role="img" aria-labelledby="title desc"><title id="title">判定基準と検証結果を照合する</title><desc id="desc">検証報告で、合格という結論の根拠を併記する。 事前に決めた基準と確認した結果を照合して判断する。</desc><rect x="30" y="23" width="732" height="113" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="30" y="182" width="732" height="113" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="30" y="23" width="7" height="113" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="30" y="182" width="7" height="113" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M786 78H828V238H786M828 159H866" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><circle cx="942" cy="159" r="61" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><path d="M913 159L933 179L972 135" fill="none" stroke="#2864F0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="55" y="85.95">判定基準</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="278" y="86.65">決めた条件をすべて満たす</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="55" y="246.95">検証結果</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size=