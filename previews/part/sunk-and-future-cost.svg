<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">過去の支出と今後変わる費用を分ける</title><desc id="desc">継続・中止の判断で、支払い済みの費用と選択肢で変わる費用を分ける。 今後の選択によって変わる費用と効果に着目する。</desc><path d="M30 173L1090 173" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M511 42L511 285" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M544 173L1061 173" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1080,173 1061,164.26 1061,181.74" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="29" y="91" width="425" height="65" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="48" y="68.65">すでに支払った費用</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="46" y="254.2">今回の判断では</tspan><tspan x="46" y="293.4">取り戻せない</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="575" y="68.65">これから変わる費用と効果</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="30.714" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="575" y="253.25">選択肢の差として</tspan><tspan x="575" y="296.25">判断する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="511.5" y="347.9">判断時点</tspan></text></g></svg>
