<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">決定に見直しの条件を添える</title><desc id="desc">暫定判断や期限付きの運用に、再確認する時点と条件を添える。 決定の有効性を、期限や前提の変化に応じて確かめ直す。</desc><rect x="29" y="38" width="471" height="214" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M527 144L1059 144" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1075,144 1059,136.64 1059,151.36" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M879 76L879 218" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><circle cx="879" cy="144" r="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#FFFFFF" data-fill-role="paper"><tspan x="55" y="93.45">今回決めたこと</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#FFFFFF" data-fill-role="paper"><tspan x="55" y="190.4">この条件で進める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="564" y="70.3">判断を見直す時点・条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="640" y="270.2">期限到来・前提の変化で</tspan><tspan x="640" y="309.4">再確認する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="33" y="324.95">決めた後も有効性を確かめる</tspan></text></g></svg>
