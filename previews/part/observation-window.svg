<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="342" viewBox="0 0 1080 342" role="img" aria-labelledby="title desc"><title id="title">集計する期間を両端で定める</title><desc id="desc">期間が異なる数値の混同を防ぐため、グラフの近くに添える。 今回の値がどの期間を対象にしたものか分かる。</desc><path d="M38 232L1043 232" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><rect x="239" y="132" width="576" height="100" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M239 103L239 255" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M815 103L815 255" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M242 232L812 232" fill="none" stroke="#2864F0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M239 90V60H815V90" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><circle cx="239" cy="232" r="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><circle cx="815" cy="232" r="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="527.0" y="37.35">今回、集計する期間</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="527.0" y="192.15">この間の記録を対象にする</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="239.0" y="301.45">開始日</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="815.0" y="301.45">終了日</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#607590" data-fill-role="muted"><tspan x="119.5" y="147.4">集計前</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#607590" data-fill-role="muted"><tspan x="951.5" y="147.4">集計後</tspan></text></g></svg>
