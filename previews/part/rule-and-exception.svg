<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">原則から例外を分けて示す</title><desc id="desc">共通ルールと異なる扱いが必要な場面。 原則を明示したうえで、例外の条件を分ける。</desc><rect x="28" y="34" width="944" height="94" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M79 128V220H184" fill="none" stroke="#153A6B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><rect x="211" y="169" width="761" height="138" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="211" y="169" width="7" height="138" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#FFFFFF" data-fill-role="paper"><tspan x="54" y="91.35">原則：受付窓口が、回答までの経過を追う</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="243" y="215.9">例外の扱い</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="243" y="275.15">契約変更の判断は、決裁する部門へ戻す。</tspan></text></g></svg>
