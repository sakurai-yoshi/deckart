<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">引継ぎを受領確認まで閉じる</title><desc id="desc">担当交代や工程間の受け渡しで、相手が受け取ったことまで確かめる。 一方的に渡すだけでなく、受領と理解を返して引継ぎを閉じる。</desc><rect x="32" y="51" width="337" height="232" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="752" y="51" width="336" height="232" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M396 136L708 136" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="723,136 708,129.1 708,142.9" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M723 211L410 211" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="396,211 410,217.44 410,204.56" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#607590" data-fill-role="muted"><tspan x="58" y="107.8">渡す側</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="58" y="208.3">内容と条件を伝える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#2864F0" data-fill-role="accent"><tspan x="779" y="107.8">受け取る側</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="779" y="208.3">受領と理解を返す</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#2864F0" data-fill-role="accent"><tspan x="560.5" y="90.75">作業・記録・注意点</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="560.5" y="282.75">不明点・受領確認</tspan></text></g></svg>
