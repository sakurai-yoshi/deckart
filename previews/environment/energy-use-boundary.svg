<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">工程へ入るエネルギーと有効利用・損失を分ける</title><desc id="desc">省エネルギーの検討で、対象範囲とエネルギーの行き先を整理する。 対象範囲をそろえ、入るエネルギーが仕事と損失へどう分かれるかを見る。</desc><rect x="362" y="154" width="558" height="403" rx="17" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><path d="M80 354L316 354" fill="none" stroke="#2864F0" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="346,354 316,340.2 316,367.8" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M931 290L1090 290" fill="none" stroke="#2864F0" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1117,290 1090,277.58 1090,302.42" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M637 384V575H1007" fill="none" stroke="#A46A16" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><polygon points="1040,575 1005,559 1005,591" fill="#A46A16" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="caution" /><rect x="443" y="300" width="389" height="137" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="638.5" y="216.45">対象とする工程</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="202.5" y="296.45">投入するエネルギー</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1028.5" y="223.45">仕事に使う分</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1000.5" y="637.95">外へ逃げる分</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="637.0" y="375.95">変換・加工・移動</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="477.0" y="664.45">同じ対象範囲で、投入と有効利用と損失を見る</tspan></text></g></svg>
