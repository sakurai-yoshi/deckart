<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">ヒヤリとした出来事を仕組みの改善へ変える</title><desc id="desc">ヒヤリハット報告を、安全な作業条件の改善へつなぐ。 事故に至らなかった出来事の条件を共有し、同じ危険を減らしたか確認する。</desc><rect x="64" y="211" width="281" height="181" rx="10" fill="#FFFFFF" stroke="#A46A16" stroke-width="3" data-fill-role="paper" data-stroke-role="caution" /><path d="M352 301L449 301" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="469,301 449,291.8 449,310.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="478" y="221" width="265" height="161" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M752 301L841 301" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="861,301 841,291.8 841,310.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="868" y="211" width="270" height="181" rx="10" fill="#2864F0" stroke="#2864F0" stroke-width="3" data-fill-role="accent" data-stroke-role="accent" /><path d="M1003 402V562H206V414" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="206,394 196,416 216,416" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="22.54" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="204.5" y="293.611">事故には至らなかった</tspan><tspan x="204.5" y="325.167">危険な出来事</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26.335" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="610.5" y="310.717">起きた条件を共有</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="1003.0" y="292.05">作業と仕組みを</tspan><tspan x="1003.0" y="329.85">変える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="599.5" y="632.45">同じ危険が残っていないか確かめる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="610.0" y="128.95">小さな兆候を、事故を防ぐ学びへ変える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="612.0" y="486.45">報告した件数で終わらせない</tspan></text></g></svg>
