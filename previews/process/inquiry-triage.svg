<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">問い合わせを担当へ振り分ける</title><desc id="desc">問い合わせ窓口で、依頼の内容に応じた対応先を決める。 依頼を一つの窓口で受け、適切な経路へ振り分ける。</desc><path d="M488 295C634 192 776 180 1065 180" fill="none" stroke="#E7F0FF" stroke-width="70" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M530 365H1065" fill="none" stroke="#F3F7FD" stroke-width="70" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="faint" /><path d="M488 435C634 539 776 550 1065 550" fill="none" stroke="#E7F0FF" stroke-width="70" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M147 185H233Q270 185 302 224L393 332M153 365H350M153 545H233Q270 545 302 506L393 398" fill="none" stroke="#79A7ED" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><circle cx="126" cy="185" r="25" fill="#FFFFFF" stroke="#153A6B" stroke-width="3.5" data-fill-role="paper" data-stroke-role="ink" /><polygon points="127,340 152,365 127,390 102,365" fill="#FFFFFF" stroke="#153A6B" stroke-width="3.5" stroke-linejoin="round" data-fill-role="paper" data-stroke-role="ink" /><rect x="102" y="520" width="50" height="50" rx="5" fill="#FFFFFF" stroke="#153A6B" stroke-width="3.5" data-fill-role="paper" data-stroke-role="ink" /><polygon points="350,365 440,215 530,365 440,515" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><polygon points="385,365 440,273 495,365 440,457" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="paper" /><circle cx="440" cy="365" r="21" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M488 295C634 192 776 180 1053 180" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1080,180 1051,166 1051,194" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M532 365L1052 365" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1080,365 1052,352.12 1052,377.88" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M488 435C634 539 776 550 1053 550" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1080,550 1051,536 1051,564" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="199.5" y="115.95">依頼を一つの窓口へ</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="444.0" y="601.95">内容・緊急度を判断</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="913.5" y="273.95">専門担当が対応</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="913.5" y="456.95">標準手順で回答</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="906.0" y="647.45">継続課題として管理</tspan></text></g></svg>
