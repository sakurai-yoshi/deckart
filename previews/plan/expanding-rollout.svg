<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">利用範囲を確かめながら広げる</title><desc id="desc">新しい業務ツールを一部チームから全社へ展開する。 小さな範囲で確認しながら、利用対象を広げる。</desc><circle cx="419" cy="366" r="272" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><circle cx="419" cy="366" r="191" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><circle cx="419" cy="366" r="110" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><circle cx="419" cy="366" r="45" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(395 350) scale(1.3)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><path d="M348 366L191 366" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="171,366 191,375.2 191,356.8" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M594 158H680V144H731" fill="none" stroke="#153A6B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M610 366H731" fill="none" stroke="#2864F0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M490 450H680V534H731" fill="none" stroke="#2864F0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><circle cx="594" cy="158" r="9" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><circle cx="610" cy="366" r="9" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="490" cy="450" r="9" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="753" y="153.45">全社・全拠点へ展開</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="753" y="375.45">関連部門へ拡大</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="753" y="543.45">対象チームで検証</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="620.5" y="688.45">確認できた範囲から広げる</tspan></text></g></svg>
