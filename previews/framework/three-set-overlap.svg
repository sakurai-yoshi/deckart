<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">必要性・実現性・継続性を満たす</title><desc id="desc">新規サービス案が顧客・技術・事業の三つの条件を満たすか検討する。 一つの条件だけでなく、三つが重なる案を選ぶ。</desc><circle cx="475" cy="235" r="205" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><circle cx="725" cy="235" r="205" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><circle cx="600" cy="451.506351" r="205" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><path d="M600 397.48077A205 205 0 0 1 600 72.51923A205 205 0 0 1 600 397.48077Z" fill="#E7F0FF" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-fill-role="pale" /><path d="M396.78753 424.49356A205 205 0 0 1 678.21247 262.01279A205 205 0 0 1 396.78753 424.49356Z" fill="#E7F0FF" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-fill-role="pale" /><path d="M521.78753 262.01279A205 205 0 0 1 803.21247 424.49356A205 205 0 0 1 521.78753 262.01279Z" fill="#E7F0FF" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-fill-role="pale" /><path d="M521.78753 262.01279A205 205 0 0 1 678.21247 262.01279A205 205 0 0 1 600 397.48077A205 205 0 0 1 521.78753 262.01279Z" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-fill-role="accent" /><circle cx="475" cy="235" r="205" fill="none" stroke="#153A6B" stroke-width="2.5" data-stroke-role="ink" /><circle cx="725" cy="235" r="205" fill="none" stroke="#153A6B" stroke-width="2.5" data-stroke-role="ink" /><circle cx="600" cy="451.506351" r="205" fill="none" stroke="#153A6B" stroke-width="2.5" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="415.0"