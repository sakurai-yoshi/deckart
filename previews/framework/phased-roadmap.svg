<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">時期ごとの目標と施策を揃える</title><desc id="desc">施策を立ち上げ、定着させ、改善するまでの見通しを共有する。 各時期に何を目指し、何に取り組むかを揃える。</desc><path d="M95 577L1085 577" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1107,577 1085,566.88 1085,587.12" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="82" y="164" width="312" height="339" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="82" y="164" width="312" height="73" rx="0" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M82 253V503H394V253" fill="none" stroke="#79A7ED" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M108 360L368 360" fill="none" stroke="#E7F0FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M238 504L238 550" fill="none" stroke="#153A6B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="238,553 262,577 238,601 214,577" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" data-fill-role="paper" data-stroke-role="accent" /><rect x="435" y="164" width="312" height="339" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="435" y="164" width="312" height="73" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M435 253V503H747V253" fill="none" stroke="#79A7ED" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M461 360L721 360" fill="none" stroke="#E7F0FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M591 504L591 550" fill="none" stroke="#153A6B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="591,553 615,577 591,601 567,577" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" data-fill-role="paper" data-stroke-role="accent" /><rect x="788" y="164" width="312" height="339" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="788" y="164" width="312" height="73" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M788 253V503H1100V253" fill="none" stroke="#79A7ED" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M814 360L1074 360" fill="none" stroke="#E7F0FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M944 504L944 550" fill="none" stroke="#153A6B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="944,553 968,577 944,601 920,577" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" data-fill-role="paper" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="238.0" y="209.45">第1期</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="238.0" y="311.95">基盤を整える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="238.0" y="423.05">ルール・データを</tspan><tspan x="238.0" y="460.85">揃える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif