<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">入口を変えずに待機系へ切り替える</title><desc id="desc">業務システムの停止に備え、利用者の入口と主系・待機系の切替関係を説明する。 入口を保ったまま、準備済みの系へ処理を引き継ぐ。</desc><rect x="89" y="285" width="207" height="151" rx="16" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M298 361H426" fill="none" stroke="#153A6B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><circle cx="441" cy="361" r="24" fill="#FFFFFF" stroke="#153A6B" stroke-width="4" data-fill-role="paper" data-stroke-role="ink" /><path d="M458 343L572 224H1018" fill="none" stroke="#79A7ED" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 9" data-stroke-role="mid" /><path d="M458 379L572 498H1018" fill="none" stroke="#2864F0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1042,498 1013,481 1013,515" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="632" y="155" width="257" height="138" rx="12" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="632" y="429" width="257" height="138" rx="12" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><rect x="652" y="175" width="217" height="30" rx="4" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="652" y="449" width="217" height="30" rx="4" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><circle cx="665" cy="190" r="3" fill="#79A7ED" stroke="none" stroke-width="2" data-fill-role="mid" /><circle cx="665" cy="464" r="3" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="680" cy="190" r="3" fill="#79A7ED" stroke="none" stroke-width="2" data-fill-role="mid" /><circle cx="680" cy="464" r="3" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="695" cy="190" r="3" fill="#79A7ED" stroke="none" stroke-width="2" data-fill-role="mid" /><circle cx="695" cy="464" r="3" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="875" cy="168" r="24" fill="#A46A16" stroke="none" stroke-width="2" data-fill-role="caution" /><path d="M875 155V170M875 179V180" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /><path d="M760 295V388" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 7" data-stroke-role="mid" /><polygon points="760,410 749,386 771,386" fill="#79A7ED" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="mid" /><path d="M976 213L998 235M998 213L976 235" fill="none" stroke="#A46A16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><path d="M1018 203L1018 245" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><circle cx="1064" cy="498" r="22" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(1051 489) scale(0.73)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="192.5" y="369.95">共通の入口</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="761.0" y="237.55">障害が起きた</tspan><tspan x="761.0" y="275.35">主系</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="761.0" y="529.95">待機系へ切替</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="967.5" y="371.95">平常時に状態を同期</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="678.5" y="647.95">異常時は利用経路を待機系へ切り替える</tspan></text></g></svg>
