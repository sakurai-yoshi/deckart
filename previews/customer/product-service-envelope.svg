<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">製品の周りに使い続ける支援を設計する</title><desc id="desc">製品販売に導入支援・保守・運用支援を組み合わせる価値を説明する。 製品の機能を中心に、顧客が成果を得るまでの支援を重ねる。</desc><rect x="90" y="105" width="1020" height="516" rx="25" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><rect x="191" y="226" width="818" height="279" rx="20" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><rect x="407" y="295" width="387" height="132" rx="12" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="241" cy="363" r="21" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><g transform="translate(229 355) scale(0.66)"><path d="M0 12L10 22L32 0" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /></g><circle cx="955" cy="363" r="21" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><g transform="translate(943 355) scale(0.66)"><path d="M0 12L10 22L32 0" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /></g><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="600.5" y="370.45">製品が果たす機能</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="601.5" y="273.95">導入・運用・保全を支えるサービス</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.5" y="168.95">顧客が使い続けて成果を得る体験</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="580.95">機能だけでなく、使い始めと使い続ける間も設計</tspan></text></g></svg>
