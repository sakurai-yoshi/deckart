<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">商談の確からしさを根拠で確認する</title><desc id="desc">案件会議で、営業の感触だけでなく次の行動につながる確認事項を共有する。 顧客課題・実現性・合意条件の根拠を確認し、足りない情報を次の行動へ変える。</desc><path d="M119 200H1050" fill="none" stroke="#E7F0FF" stroke-width="30" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><circle cx="194" cy="200" r="32" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(176 188) scale(0.96)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><path d="M194 234L194 433" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><rect x="64" y="444" width="260" height="105" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><circle cx="549" cy="200" r="32" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(531 188) scale(0.96)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><path d="M549 234L549 433" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><rect x="419" y="444" width="260" height="105" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><circle cx="904" cy="200" r="32" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(886 188) scale(0.96)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><path d="M904 234L904 433" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><rect x="774" y="444" width="260" height="105" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M230 200L492 200" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="510,200 492,191.72 492,208.28" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M585 200L847 200" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="865,200 847,191.72 847,208.28" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M942 200L1102 200" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1120,200 1102,191.72 1102,208.28" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="194.0" y="118.95">課題が明確</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="194.0" y="487.05">確認が足りない</tspan><tspan x="194.0" y="524.85">情報を集める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="549.0" y="118.95">実現できる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="549.0" y="487.05">確認が足りない</tspan><tspan x="549.0" y="524.85">情報を集める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="904.0" y="118.95">合意できる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="904.0" y="487.05">確認が足りない</tspan><tspan x="904.0" y="524.85">情報を集める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="603.0" y="349.45">根拠を得て、次の提案へ進む</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="612.0" y="641.45">未確認を失注と決めず、次に調べる内容を定める</tspan></text></g></svg>
