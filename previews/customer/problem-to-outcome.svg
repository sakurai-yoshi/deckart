<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">困りごとを顧客が得たい状態へ言い換える</title><desc id="desc">商品企画や提案で、解決すべき課題と顧客側の成果を整理する。 自社が何を作るかより先に、顧客の行動や状態がどう変わるかを明確にする。</desc><rect x="74" y="226" width="386" height="292" rx="10" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="740" y="226" width="386" height="292" rx="10" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M477 363L689 363" fill="none" stroke="#2864F0" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="720,363 689,348.74 689,377.26" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="267.0" y="179.45">顧客が困ること</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="933.0" y="179.45">顧客が得たい状態</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="267.0" y="330.15">何度も入力する</tspan><tspan x="267.0" y="367.95">ミスに気づきにくい</tspan><tspan x="267.0" y="405.75">確認に時間がかかる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="933.0" y="330.15">一度で入力が済む</tspan><tspan x="933.0" y="367.95">その場で確認できる</tspan><tspan x="933.0" y="405.75">早く次の作業へ進める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="599.0" y="467.05">解決した後の</tspan><tspan x="599.0" y="504.85">行動の変化</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="603.5" y="642.95">機能の名前より先に、顧客の変化を定める</tspan></text></g></svg>
