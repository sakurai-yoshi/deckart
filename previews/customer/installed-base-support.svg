<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">納入した製品の稼働と支援をつなぐ</title><desc id="desc">納入後の保守や更新提案に向け、導入先ごとの情報を共有する。 導入先ごとの稼働・保守履歴を集め、必要な支援や更新につなげる。</desc><circle cx="600" cy="341" r="95" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="90" y="111" width="280" height="118" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M378 170L479.945706 282.86846" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="490,294 485.066214,278.243485 474.825198,287.493436" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="827" y="111" width="280" height="118" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M819 170L719.903273 282.733892" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="710,294 725.085682,287.289397 714.720863,278.178386" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="90" y="471" width="280" height="118" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M378 530L480.295338 409.437637" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="490,398 475.034025,404.973493 485.556651,413.901781" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="827" y="471" width="280" height="118" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M819 530L719.550957 409.566297" f