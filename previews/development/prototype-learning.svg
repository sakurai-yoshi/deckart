<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">試作で疑問を減らして設計判断へ戻す</title><desc id="desc">試作の目的を、見栄えの完成から技術や顧客の疑問の検証へ整理する。 試作で得た結果を設計判断へ返し、残った疑問を次の試作に引き継ぐ。</desc><path d="M155 213L1045 213" fill="none" stroke="#E7F0FF" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M155 493L1045 493" fill="none" stroke="#E7F0FF" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><circle cx="182" cy="213" r="84" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><circle cx="597" cy="213" r="84" fill="#2864F0" stroke="#2864F0" stroke-width="3" data-fill-role="accent" data-stroke-role="accent" /><circle cx="1012" cy="213" r="84" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M273 213L481 213" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="500,213 481,204.26 481,221.74" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M690 213L896 213" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="915,213 896,204.26 896,221.74" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M1012 303V493H186V312" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="186,293 176,315 196,315" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="353" y="443" width="494" height="100" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26.496" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="182.0" y="222.274">疑問を絞る</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="597.0" y="203.55">試作品で</tspan><tspan x="597.0" y="241.35">調べる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="26.496" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1012.0" y="222.274">判断を更新</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="502.45">残った疑問を次の試作へ</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="602.5" y="102.45">試作品を「完成形」よりも「学ぶ道具」として使う</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25.358" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="603.5" y="641.875">確かめる問いを一つずつ明確にする</tspan></text></g></svg>
