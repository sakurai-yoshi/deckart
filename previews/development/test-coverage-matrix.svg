<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">機能と使用条件から試験の抜けを見つける</title><desc id="desc">試験計画やレビューで、確認済みの組み合わせと未確認箇所を共有する。 機能別の確認だけでなく、使用条件との組み合わせを見渡す。</desc><rect x="405" y="196" width="202" height="116" rx="6" fill="#F3F7FD" stroke="#79A7ED" stroke-width="2" data-fill-role="faint" data-stroke-role="mid" /><circle cx="506" cy="254" r="22" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(493 245) scale(0.75)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><rect x="652" y="196" width="202" height="116" rx="6" fill="#F3F7FD" stroke="#79A7ED" stroke-width="2" data-fill-role="faint" data-stroke-role="mid" /><circle cx="753" cy="254" r="22" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(740 245) scale(0.75)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><rect x="899" y="196" width="202" height="116" rx="6" fill="#F3F7FD" stroke="#79A7ED" stroke-width="2" data-fill-role="faint" data-stroke-role="mid" /><circle cx="1000" cy="254" r="22" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(987 245) scale(0.75)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="paper" /></g><rect x="405" y="347" width="202" height="116" rx="6" fill="#F3F7FD" stroke="#79A7ED" stroke-width="2" data-fill-role="faint" data-stroke-role="mid" /><circle cx="506" cy="405" r="22" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g transform="translate(493 396) scale(0.75)"><path d="M0 12L10 22L32 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke