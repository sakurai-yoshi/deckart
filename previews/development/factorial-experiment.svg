<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">二つの要因を組み合わせて試験する</title><desc id="desc">試作や工程条件の検討で、二つの要因を系統的に変えて試す。 組み合わせた条件を比較することで、一方だけを変える試験では見えにくい関係を調べる。</desc><rect x="384" y="215" width="308" height="174" rx="8" fill="#F3F7FD" stroke="#2864F0" stroke-width="2" data-fill-role="faint" data-stroke-role="accent" /><circle cx="438" cy="264" r="19" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="724" y="215" width="308" height="174" rx="8" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><circle cx="778" cy="264" r="19" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="384" y="426" width="308" height="174" rx="8" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><circle cx="438" cy="475" r="19" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="724" y="426" width="308" height="174" rx="8" fill="#F3F7FD" stroke="#2864F0" stroke-width="2" data-fill-role="faint" data-stroke-role="accent" /><circle cx="778" cy="475" r="19" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><path d="M354 181L1089 181" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1103,181 1089,174.56 1089,187.44" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M342 188L342 594" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="342,608 348.44,594 335.56,594" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="675.0" y="76.45">要因 A の条件を変える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="538.0" y="152.95">A：低い条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="878.0" y="152.95">A：高い条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="189.0" y="326.45">B：低い条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="189.0" y="537.45">B：高い条件</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="566.5" y="275.95">条件 1</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="538.0" y="348.95">同じ方法で測る</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="906.5" y="275.95">条件 2</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="878.0" y="348.95">同じ方法で測る</tspan></