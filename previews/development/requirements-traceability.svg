<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">要求・設計・試験をひも付ける</title><desc id="desc">要求の抜け漏れや変更時の再確認範囲をレビューする。 要求から設計と試験までの対応を保持し、何を確認したかをたどれるようにする。</desc><path d="M248 219L960 219" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M248 369L960 369" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M248 519L960 519" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><circle cx="250" cy="219" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="250" cy="369" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="250" cy="519" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="595" cy="219" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="595" cy="369" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="595" cy="519" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="960" cy="219" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="960" cy="369" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="960" cy="519" r="8" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="105" y="175" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="470" y="175" width="260" height="88" rx="10" fill="#E7F0FF" stroke="#153A6B" stroke-width="3" data-fill-role="pale" data-stroke-role="ink" /><rect x="835" y="175" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="105" y="325" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="470" y="325" width="260" height="88" rx="10" fill="#E7F0FF" stroke="#153A6B" stroke-width="3" data-fill-role="pale" data-stroke-role="ink" /><rect x="835" y="325" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="105" y="475" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="470" y="475" width="260" height="88" rx="10" fill="#E7F0FF" stroke="#153A6B" stroke-width="3" data-fill-role="pale" data-stroke-role="ink" /><rect x="835" y="475" width="260" height="88" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M237 570V607H964V570" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="235.0" y="110.45">使う人の要求</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="110.45">実現する設計</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="965.0" y="110.45">確かめる試験</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="235.0" y="228.45">持ち運べる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="228.45">軽量な構造</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="965.0" y="228.45">重量を測る</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="235.0" y="378.45">静かに使える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="378.45">振動を抑える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="965.0" y="378.45">動作音を測る</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="235.0" y="528.45">長く使える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="528.45">摩耗しにくい</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="965.0" y="528.45">耐久試験</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="656.45">変更時も、対応する要求と試験をたどる</tspan></text></g></svg>
