-role="accent" /><path d="M810 193L810 221" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><rect x="810" y="272" width="160" height="117" rx="0" fill="#FFFFFF" stroke="#A46A16" stroke-width="3" data-fill-role="paper" data-stroke-role="caution" /><path d="M826 373L954 287M854 373L954 306M883 373L954 325" fill="none" stroke="#A46A16" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><path d="M889 204L889 258" fill="none" stroke="#A46A16" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><path d="M135 456L970 456" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M135 440L135 472" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M970 440L970 472" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="235.0" y="341.45">部品 A</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="467.5" y="341.45">部品 B</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="705.0" y="341.45">部品 C</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="89