<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">全体の中に担当範囲を置く</title><desc id="desc">事業・部門・チームの担当範囲を説明する。 小さな担当範囲は上位の範囲に含まれる。</desc><rect x="94" y="85" width="1012" height="551" rx="40" fill="#E7F0FF" stroke="#153A6B" stroke-width="4" data-fill-role="pale" data-stroke-role="ink" /><rect x="366" y="249" width="675" height="325" rx="30" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><rect x="699" y="397" width="286" height="119" rx="23" fill="#E7F0FF" stroke="#153A6B" stroke-width="4" data-fill-role="pale" data-stroke-role="ink" /><path d="M135 188L315 188" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M408 346L633 346" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="129" y="154.45">事業全体の領域</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="402" y="313.45">部門が受け持つ範囲</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="842.5" y="465.45">チームの担当範囲</tspan></text></g></svg>
