<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">複数の供給先を一つの経路で巡回する</title><desc id="desc">調達物流で、個別便から定期巡回へまとめる考え方を説明する。 複数の供給先を決まった経路で回り、共通の受入先へまとめて運ぶ。</desc><path d="M286 172H944Q1025 172 1025 253V457Q1025 541 941 541H281Q196 541 196 456V255Q196 172 286 172Z" fill="none" stroke="#E7F0FF" stroke-width="27" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M412 172L695 172" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="715,172 695,162.8 695,181.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M1025 291L1025 395" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1025,415 1034.2,395 1015.8,395" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M895 541L542 541" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="522,541 542,550.2 542,531.8" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M196 428L196 303" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="196,283 186.8,303 205.2,303" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="164" y="129" width="244" height="86" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><rect x="822" y="129" width="244" height="86" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><rect x="822" y="498" width="244" height="86" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><rect x="149" y="491" width="274" height="102" rx="10" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="286.0" y="181.45">供給先 A</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="944.0" y="181.45">供給先 B</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="944.0" y="550.45">供給先 C</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="286.0" y="551.45">共通の受入先</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="601.5" y="328.55">一つの巡回で</tspan><tspan x="601.5" y="366.35">複数の供給先から集める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="625.0" y="667.45">受け取り時刻と必要量を巡回に合わせる</tspan></text></g></svg>
