<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">製造ロットを納期に合わせて分納する</title><desc id="desc">生産効率のためのロットと、顧客へ届ける単位の違いを説明する。 作る量をまとめても、届ける量と時期は顧客の必要に合わせて分けられる。</desc><rect x="93" y="210" width="323" height="322" rx="10" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><rect x="141" y="247" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="230" y="247" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="319" y="247" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="141" y="326" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="230" y="326" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="319" y="326" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="141" y="405" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="230" y="405" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="319" y="405" width="52" height="57" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><path d="M425 369H602V227H790" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="809,227 787,217 787,237" fill="#2864F0" stroke="none" stroke-