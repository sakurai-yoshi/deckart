<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">供給リスクと事業への影響で調達方針を分ける</title><desc id="desc">取引先を同じ方法で扱わず、関係づくりや代替準備の重点を整理する。 供給リスクと事業への影響を合わせ、調達の関わり方を決める。</desc><path d="M207 584L1102 584" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1118,584 1102,576.64 1102,591.36" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M207 584L207 98" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="207,82 199.64,98 214.36,98" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="250" y="129" width="391" height="200" rx="5" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="673" y="129" width="391" height="200" rx="5" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="250" y="365" width="391" height="200" rx="5" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="673" y="365" width="391" height="200" rx="5" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><circle cx="868" cy="148" r="10" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="445.5" y="209.55">代替を備える</tspan><tspan x="445.5" y="247.35">供給を優先</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="868.5" y="209.55">共同で計画</tspan><tspan x="868.5" y="247.35">関係を深める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="445.5" y="445.55">手順を簡潔に</tspan><tspan x="445.5" y="483.35">効率よく調達</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="868.5" y="445.55">条件を比較</tspan><tspan x="868.5" y="483.35">購買力を生かす</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="103.5" y="162.15">上ほど</tspan><tspan x="103.5" y="199.95">供給上の</tspan><tspan x="103.5" y="237.75">リスク</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="837.5" y="656.95">右ほど、事業への影響が大きい</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="697.5" y="70.45">取引先の特性に応じて、関わり方を変える</tspan></text></g></svg>
