<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">予測で準備する範囲と受注で動く範囲を分ける</title><desc id="desc">見込生産と受注生産の境界を整理し、在庫の役割を説明する。 予測と実際の注文を、意図した在庫地点でつなぐ。</desc><rect x="68" y="236" width="434" height="185" rx="9" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="706" y="236" width="425" height="185" rx="9" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="527" y="194" width="153" height="269" rx="9" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><rect x="554" y="225" width="99" height="49" rx="3" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="554" y="300" width="99" height="49" rx="3" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="554" y="375" width="99" height="49" rx="3" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><path d="M115 328L489 328" fill="none" stroke="#2864F0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="509,328 489,318.8 489,337.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M693 328L1062 328" fill="none" stroke="#2864F0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="1082,328 1062,318.8 1062,337.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="283.5" y="158.45">需要を見込んで準備</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="918.0" y="158.45">注文に合わせて進める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="602.5" y="558.95">二つをつなぐ在庫</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="306.5" y="630.45">予測で動く範囲</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="923.5" y="630.45">注文で動く範囲</tspan></text></g></svg>
