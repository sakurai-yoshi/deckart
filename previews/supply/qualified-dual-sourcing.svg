<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">要求を満たす代替供給先を備える</title><desc id="desc">部材の供給停止リスクに備え、調達先の代替性を説明する。 供給先の数を増やすだけでなく、代替先でも必要な仕様と量を確保できるようにする。</desc><rect x="101" y="118" width="323" height="141" rx="10" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><rect x="101" y="433" width="323" height="141" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M429 188H673V355H828" fill="none" stroke="#79A7ED" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" data-stroke-role="mid" /><path d="M514 166L550 210" fill="none" stroke="#A46A16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><path d="M550 166L514 210" fill="none" stroke="#A46A16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><path d="M429 503H673V382H814" fill="none" stroke="#2864F0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="841,382 813,369 813,395" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="845" y="285" width="253" height="155" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="262.5" y="197.95">主な供給先</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="262.5" y="512.95">代替の供給先</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="971.5" y="353.05">必要な供給を</tspan><tspan x="971.5" y="390.85">確保する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="791.0" y="109.45">主な供給が止まったときの代替経路</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="768.5" y="606.45">同じ要求を満たせるか、平常時に確認</tspan></text></g></svg>
