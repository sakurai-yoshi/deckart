<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">判断・実行・支援の関係を分ける</title><desc id="desc">プロジェクト運営で意思決定者、実行担当、支援組織の役割を説明する。 権限の委譲、結果の報告、実行支援を分けて設計する。</desc><circle cx="249" cy="300" r="111" fill="#FFFFFF" stroke="#153A6B" stroke-width="12" data-fill-role="paper" data-stroke-role="ink" /><circle cx="895" cy="300" r="111" fill="#FFFFFF" stroke="#2864F0" stroke-width="12" data-fill-role="paper" data-stroke-role="accent" /><path d="M367 265L749 265" fill="none" stroke="#2864F0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="775,265 749,253.04 749,276.96" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M775 335L389 335" fill="none" stroke="#153A6B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="367,335 389,345.12 389,324.88" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="468" y="552" width="619" height="105" rx="16" fill="#E7F0FF" stroke="#153A6B" stroke-width="3" data-fill-role="pale" data-stroke-role="ink" /><path d="M895 550L895 440" fill="none" stroke="#79A7ED" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><polygon points="895,418 884.88,440 905.12,440" fill="#79A7ED" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="mid" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="249.0" y="309.45">意思決定</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="895.0" y="309.45">実行の担当</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="777.5" y="615.45">実行を支える共通の仕組み</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="571.5" y="215.45">方針と権限を渡す</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="571.5" y="433.45">状況と結果を返す</tspan></text></g></svg>
