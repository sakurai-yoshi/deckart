<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">組織の基盤から顧客の成果へ</title><desc id="desc">組織への投資が、提供価値を通じて顧客の成果へつながることを説明する。 顧客の成果は価値提供と組織基盤の上に成り立つ。</desc><polygon points="600,76 447,280 753,280" fill="#E7F0FF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" data-fill-role="pale" data-stroke-role="paper" /><polygon points="447,280 753,280 881,451 319,451" fill="#E7F0FF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" data-fill-role="pale" data-stroke-role="paper" /><polygon points="319,451 881,451 1023,641 177,641" fill="#E7F0FF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" data-fill-role="pale" data-stroke-role="paper" /><path d="M600 76L1023 641H177Z" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M447 280L753 280" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M319 451L881 451" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><rect x="177" y="641" width="846" height="17" rx="3" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M112 564L318.37234 289.779219" fill="none" stroke="#79A7ED" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><polygon points="331,273 310.653899,283.970496 326.090781,295.587943" fill="#79A7ED" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="mid" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="247.45">顧客の成果</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="380.45">提供する価値</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="600.0" y="565.45">価値を支える組織の基盤</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="231.5" y="178.45">基盤から成果へつなぐ</tspan></text></g></svg>
