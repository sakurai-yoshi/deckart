<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">現在の事業と次の成長へ取り組みを配分する</title><desc id="desc">事業ポートフォリオで短期の収益と将来の探索の役割を整理する。 既存事業を支えながら、次の成長と新しい可能性を異なる時間軸で育てる。</desc><rect x="82" y="516" width="1037" height="97" rx="7" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M143 483C195 347 347 350 486 355S777 352 862 225S999 119 1090 109" fill="none" stroke="#E7F0FF" stroke-width="34" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><path d="M143 483C195 347 347 350 486 355S777 352 862 225S999 119 1090 109" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><circle cx="235" cy="378" r="17" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><circle cx="637" cy="351" r="17" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><circle cx="995" cy="128" r="17" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="600.0" y="573.95">現在の事業が全体を支える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="306.0" y="459.45">既存を強くする</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="637.0" y="448.95">次の成長を育てる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="978.0" y="339.45">新しい可能性を試す</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="431.5" y="103.45">現在の収益と、将来の成長へ配分する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="766.0" y="673.95">取り組みごとに期待する成果と判断時点を分ける</tspan></text></g></svg>
