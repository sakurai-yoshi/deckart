<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">重点と後にする範囲を同時に決める</title><desc id="desc">戦略の優先順位を資源配分に結びつけ、選択の意味を説明する。 すべてを同じ強さで進めず、重点と見送る範囲を明確にする。</desc><circle cx="201" cy="352" r="89" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M298 351H424" fill="none" stroke="#153A6B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><circle cx="438" cy="351" r="13" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M454 343C601 251 614 216 721 216H961" fill="none" stroke="#2864F0" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="998,216 962,196 962,236" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M455 360C590 442 660 467 853 467" fill="none" stroke="#79A7ED" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M852 443L852 491" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="201.0" y="343.05">限りある</tspan><tspan x="201.0" y="380.85">資源</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="823.5" y="148.95">重点へ厚く配分</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="824.5" y="550.45">今は優先しない範囲</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="614.0" y="650.45">何を強めるかと、何を後にするかを一緒に決める</tspan></text></g></svg>
