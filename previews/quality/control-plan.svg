<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">工程・管理特性・確認・異常時対応を一組にする</title><desc id="desc">工程の品質管理を、測定だけで終わらない運用に整理する。 各工程で見る特性と確認方法、基準から外れたときの対応をつなぐ。</desc><rect x="92" y="114" width="1016" height="476" rx="9" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="115" y="137" width="240" height="65" rx="5" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="365" y="137" width="280" height="65" rx="5" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="654" y="137" width="217" height="65" rx="5" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="878" y="137" width="205" height="65" rx="5" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><rect x="115" y="246" width="968" height="105" rx="6" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="115" y="389" width="968" height="105" rx="6" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><path d="M367 202L367 548" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M656 202L656 548" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M880 202L880 548" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="235.0" y="179.45">工程</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="505.0" y="179.45">管理する特性</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="762.5" y="179.45">確認方法</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="980.5" y="179.45">外れた場合</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="235.0" y="307.45">加工</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="505.0" y="307.45">重要な寸法</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="762.5" y="307.45">ゲージ</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="980.5" y="307.45">止めて確認</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="235.0" y="450.45">組立</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="505.0" y="450.45">締結の状態</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="762.5" y="450.45">記録</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="980.5" y="450.45">隔離して処置</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="602.5" y="655.95">「何を測るか」と「外れたらどうするか」を一組に</tspan></text></g></svg>
