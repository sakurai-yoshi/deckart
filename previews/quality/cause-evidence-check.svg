<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">原因の仮説を事実で確かめる</title><desc id="desc">不具合対策で、原因の思い込みと確認済みの原因を分ける。 仮説に合う事実を確認し、一致しなければ別の仮説へ戻る。</desc><rect x="78" y="258" width="249" height="157" rx="10" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><path d="M334 337L443 337" fill="none" stroke="#2864F0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="463,337 443,327.8 443,346.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><polygon points="470,337 601,216 732,337 601,458" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" data-fill-role="paper" data-stroke-role="ink" /><path d="M734 337H777V174H850" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="871,174 847,163 847,185" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="875" y="123" width="254" height="102" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M734 337H777V500H850" fill="none" stroke="#A46A16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><polygon points="871,500 847,489 847,511" fill="#A46A16" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="caution" /><rect x="875" y="449" width="254" height="102" rx="10" fill="#FFFFFF" stroke="#A46A16" stroke-width="3" data-fill-role="paper" data-stroke-role="caution" /><path d="M1000 554V631H203V433" fill="none" stroke="#A46A16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><polygon points="203,414 193,437 213,437" fill="#A46A16" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="caution" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="202.5" y="345.95">原因の仮説</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="601.0" y="328.05">事実と</tspan><tspan x="601.0" y="365.85">一致するか</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1002.0" y="183.45">裏付けがある</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1002.0" y="509.45">仮説を見直す</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="702.0" y="103.95">思いついた原因を、そのまま真因にしない</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="552.0" y="582.45">観察・再現・測定で確認</tspan></text></g></svg>
