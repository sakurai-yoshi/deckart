<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">発生を防ぐ対策と流出を見つける対策を分ける</title><desc id="desc">品質改善で、予防策と検出策の役割を説明する。 起こりにくくする仕組みと、起きた不具合を通さない仕組みを組み合わせる。</desc><path d="M75 357L1113 357" fill="none" stroke="#E7F0FF" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="pale" /><circle cx="222" cy="357" r="42" fill="#FFFFFF" stroke="#153A6B" stroke-width="4" data-fill-role="paper" data-stroke-role="ink" /><circle cx="611" cy="357" r="42" fill="#A46A16" stroke="none" stroke-width="2" data-fill-role="caution" /><circle cx="1032" cy="357" r="42" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><path d="M271 357L542 357" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="561,357 542,348.26 542,365.74" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M660 357L963 357" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="982,357 963,348.26 963,365.74" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="420" y="232" width="17" height="248" rx="4" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="812" y="232" width="17" height="248" rx="4" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M603 182L603 244" fill="none" stroke="#A46A16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="292.5" y="171.45">発生を防ぐ</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="919.5" y="171.45">流出前に見つける</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="279.5" y="554.55">起こりにくい設計</tspan><tspan x="279.5" y="592.35">間違えにくい手順</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="915.5" y="554.55">検査・監視</tspan><tspan x="915.5" y="592.35">出荷前の確認</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="612.0" y="453.95">不具合の発生</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="610.0" y="98.95">予防と検出は別の働き</tspan></text></g></svg>
