<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">発生と影響から対応を決める</title><desc id="desc">プロジェクトのリスクを洗い出し、対策に着手する順序を決める。 起こりやすく影響の大きい事象へ、先に対策を用意する。</desc><rect x="272" y="156" width="258" height="130" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="542" y="156" width="258" height="130" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="812" y="156" width="258" height="130" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="272" y="298" width="258" height="130" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="542" y="298" width="258" height="130" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="812" y="298" width="258" height="130" rx="0" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="272" y="440" width="258" height="130" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="542" y="440" width="258" height="130" rx="0" fill="#F3F7FD" stroke="none" stroke-width="2" data-fill-role="faint" /><rect x="812" y="440" width="258" height="130" rx="0" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><path d="M236 598L1100 598" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1118,598 1100,589.72 1100,606.28" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M236 598L236 134" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="236,116 227.72,134 244.28,134" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M805 150H1076V292" fill="none" stroke="#153A6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="942,176 965,216 919,216" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="paper" /><path d="M942 188L942 200" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><circle cx="942" cy="208" r="2" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="229" y="74.45">上ほど影響が大きい</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="921.0" y="664.45">右ほど発生しやすい</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="401.5" y="516.95">監視を継続</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="670.5" y="376.95">対策を計画</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="940.5" y="258.95">重点的に低減</tspan></text></g></svg>
