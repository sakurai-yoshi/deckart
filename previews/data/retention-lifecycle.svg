<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">利用・保管・処分を情報のライフサイクルで考える</title><desc id="desc">文書やデータの整理で、利用目的と保管の終了条件を共有する。 作成時から利用と保管の目的を定め、必要性と適用条件を確認して処分する。</desc><path d="M98 559L1093 559" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1111,559 1093,550.72 1093,567.28" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="93" y="222" width="356" height="252" rx="10" fill="#2864F0" stroke="#153A6B" stroke-width="2" data-fill-role="accent" data-stroke-role="ink" /><rect x="469" y="222" width="307" height="252" rx="10" fill="#E7F0FF" stroke="#153A6B" stroke-width="2" data-fill-role="pale" data-stroke-role="ink" /><rect x="796" y="222" width="313" height="252" rx="10" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><path d="M459 179L459 591" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" data-stroke-role="ink" /><path d="M786 179L786 591" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="271.0" y="344.45">業務で利用する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="622.5" y="344.45">必要な期間保管</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="952.5" y="344.45">見直して処分</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="603.0" y="112.45">情報の利用目的と、保管する期間を一緒に決める</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="617.0" y="650.45">必要性・定めた期間・例外を確認して判断</tspan></text></g></svg>
