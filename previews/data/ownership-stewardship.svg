<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">データの業務責任・品質管理・技術を分担する</title><desc id="desc">データガバナンスの体制づくりで、担当の役割を明確にする。 データの意味と目的、品質と定義、技術的な実装を分けて責任を持つ。</desc><rect x="469" y="247" width="269" height="174" rx="10" fill="#2864F0" stroke="#2864F0" stroke-width="3" data-fill-role="accent" data-stroke-role="accent" /><rect x="73" y="88" width="289" height="128" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="835" y="88" width="289" height="128" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="443" y="535" width="325" height="127" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><path d="M313 222L439.877825 284.995284" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="456,293 443.559995,277.579083 436.195656,292.411484" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M884 222L767.852334 284.473366" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="752,293 771.774586,291.765439 763.930083,277.181292" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M605 520L605 454" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="605,436 596.72,454 613.28,454" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="603.5" y="324.55">業務で使う</tspan><tspan x="603.5" y="362.35">共通データ</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="217.5" y="142.55">業務責任者</tspan><tspan x="217.5" y="180.35">意味と利用目的</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="979.5" y="142.55">管理担当</tspan><tspan x="979.5" y="180.35">品質と定義</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="605.5" y="589.05">技術担当</tspan><tspan x="605.5" y="626.85">保存・接続・保護</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="24.84" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="597.5" y="55.194">責任・管理・技術を一人の曖昧な担当にしない</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="217.5" y="523.55">何を決める役割かを</tspan><tspan x="217.5" y="561.35">具体的に分ける</tspan></text></g></svg>
