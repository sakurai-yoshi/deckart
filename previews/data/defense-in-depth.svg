<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">認証・権限・監視を重ねて情報を守る</title><desc id="desc">情報セキュリティの多層防御を、役割の異なる確認として説明する。 一つの入口だけに依存せず、接続・操作・情報利用の各段階で守る。</desc><rect x="227" y="91" width="877" height="547" rx="21" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><rect x="432" y="211" width="635" height="383" rx="17" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><rect x="669" y="336" width="342" height="216" rx="14" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M56 504L170 504" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="188,504 170,495.72 170,512.28" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M228 480L228 528" fill="none" stroke="#153A6B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M432 480L432 528" fill="none" stroke="#2864F0" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M669 480L669 528" fill="none" stroke="#153A6B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><path d="M258 504H397M460 504H634M697 504H962" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="629.5" y="164.45">接続を認証する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="740.5" y="286.45">操作ごとの権限を確かめる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="839.5" y="410.55">重要な情報を</tspan><tspan x="839.5" y="448.35">記録・監視する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="664.5" y="687.95">一つの対策が破られても、次の層で確かめる</tspan></text></g></svg>
