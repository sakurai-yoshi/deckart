<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">予測を実績と照合して更新する</title><desc id="desc">需要や保全の予測モデルを使う際、利用後の確認と更新を説明する。 予測の出力だけで終わらず、実績との違いと条件の変化を次の更新へ返す。</desc><rect x="63" y="243" width="229" height="145" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><rect x="488" y="243" width="259" height="145" rx="10" fill="#2864F0" stroke="#2864F0" stroke-width="3" data-fill-role="accent" data-stroke-role="accent" /><rect x="917" y="243" width="218" height="145" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M301 315L455 315" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="475,315 455,305.8 455,324.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M756 315L883 315" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="903,315 883,305.8 883,324.2" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M1026 397V576H617V410" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="617,389 607,413 627,413" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><rect x="747" y="526" width="251" height="98" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="177.5" y="306.05">過去と現在の</tspan><tspan x="177.5" y="343.85">情報</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="617.5" y="324.95">予測する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1026.0" y="324.95">判断に使う</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="872.5" y="584.45">実績と照合</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="745.0" y="97.95">予測を出した後に、外れ方を確かめる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="383.0" y="551.55">変化した条件と、予測の偏りを</tspan><tspan x="383.0" y="589.35">次の更新へ反映する</tspan></text></g></svg>
