<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">効果の上積みと負担を見比べる</title><desc id="desc">設備やシステムへの投資案について、追加負担に見合う効果を説明する。 負担を増やしたときの効果の上積みを見て選ぶ。</desc><path d="M250 540Q450 250 650 210Q850 170 1050 170V590H250Z" fill="#F3F7FD" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-fill-role="faint" /><path d="M250 540Q450 250 650 210Q850 170 1050 170" fill="none" stroke="#79A7ED" stroke-width="19" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M250 540Q450 250 650 210Q850 170 1050 170" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M193 610L1098 610" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1115,610 1098,602.18 1098,617.82" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M192 610L192 136" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="192,119 184.18,136 199.82,136" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M650 251L650 590" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 10" data-stroke-role="mid" /><path d="M209 210L608 210" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 10" data-stroke-role="mid" /><circle cx="350" cy="410.625" r="18" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><circle cx="650" cy="210" r="34" fill="#FFFFFF" stroke="#2864F0" stroke-width="6" data-fill-role="paper" data-stroke-role="accent" /><g transform="translate(630 195) scale(1.1)"><path d="M0 12L10 22L32 0" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /></g><circle cx="950" cy="172.5" r="18" fill="#FFFFFF" stroke="#2864F0" stroke-width="4" data-fill-role="paper" data-stroke-role="accent" /><path d="M365 433L410 475" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><path d="M673 237L705 280" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><path d="M950 122L950 148" fill="none" stroke="#79A7ED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="mid" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#153A6B" data-fill-role="ink"><tspan x="182" y="68.45">上ほど期待効果が高い</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="943.5" y="671.45">右ほど必要な負担が大きい</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="495.0" y="536.95">小さく始める案</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="883.5" y="339.45">均衡を重視する案</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="950.0" y="78.45">大きく投資する案</tspan></text></g></svg>
