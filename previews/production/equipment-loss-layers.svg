<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">設備の時間損失を段階に分けて見る</title><desc id="desc">設備改善の会議で、停止・速度低下・不良を分けて優先課題を整理する。 使える時間から、実際に良品を作る時間までの減少要因を分ける。</desc><rect x="361" y="112" width="732" height="90" rx="4" fill="#F3F7FD" stroke="#153A6B" stroke-width="2" data-fill-role="faint" data-stroke-role="ink" /><rect x="361" y="279" width="596" height="90" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="361" y="446" width="451" height="90" rx="4" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><rect x="957" y="279" width="136" height="90" rx="4" fill="#FFFFFF" stroke="#A46A16" stroke-width="2" data-fill-role="paper" data-stroke-role="caution" /><rect x="812" y="446" width="145" height="90" rx="4" fill="#FFFFFF" stroke="#A46A16" stroke-width="2" data-fill-role="paper" data-stroke-role="caution" /><path d="M1093 209V266M957 376V432" fill="none" stroke="#A46A16" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><path d="M1093 241L1093 259" fill="none" stroke="#A46A16" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><polygon points="1093,272 1098.98,259 1087.02,259" fill="#A46A16" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="caution" /><path d="M957 404L957 425" fill="none" stroke="#A46A16" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="caution" /><polygon points="957,438 962.98,425 951.02,425" fill="#A46A16" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="caution" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="212.5" y="150.95">使える時間</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="212.5" y="317.95">動いている時間</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="212.5" y="484.95">良品を作る時間</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="1025.0" y="333.45">停止</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="22.5" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="884.5" y="482.625">遅れ</tspan><tspan x="884.5" y="514.125">不良</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="729.0" y="634.95">どの段階で有効な時間が失われるかを見る</tspan></text></g></svg>
