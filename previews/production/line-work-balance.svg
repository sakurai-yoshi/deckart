<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">長い工程の作業を余力のある工程へ分担する</title><desc id="desc">ライン設計で、工程ごとの作業量と再配分できる範囲を共有する。 長い工程だけを急がせず、作業を分けて全体の処理ペースをそろえる。</desc><path d="M160 213L1065 213" fill="none" stroke="#2864F0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" data-stroke-role="accent" /><path d="M160 536L1065 536" fill="none" stroke="#153A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><rect x="254" y="486" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="254" y="424" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="254" y="362" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="575" y="486" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="575" y="424" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="575" y="362" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="575" y="300" width="152" height="47" rx="4" fill="#2864F0" stroke="#2864F0" stroke-width="2" data-fill-role="accent" data-stroke-role="accent" /><rect x="575" y="238" width="152" height="47" rx="4" fill="#2864F0" stroke="#2864F0" stroke-width="2" data-fill-role="accent" data-stroke-role="accent" /><rect x="896" y="486" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><rect x="896" y="424" width="152" height="47" rx="4" fill="#E7F0FF" stroke="#2864F0" stroke-width="2" data-fill-role="pale" data-stroke-role="accent" /><path d="M741 238H832V382H893" fill="none" stroke="#2864F0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="912,382 889,371 889,393" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="330.0" y="609.45">工程 A</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="651.0" y="609.45">工程 B</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="972.0" y="609.45">工程 C</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="603.0" y="101.45">工程間で作業を再配分する</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="263.5" y="181.95">目標の処理枠</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="967.0" y="324.45">分担を移せるか確認</tspan></text></g></svg>
