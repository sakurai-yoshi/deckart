<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">止めて行う段取りと事前準備を分ける</title><desc id="desc">品種切替や設備交換の停止時間を短くする考え方を説明する。 設備を止める必要がある作業だけを停止中に残し、準備は稼働中に進める。</desc><rect x="312" y="150" width="798" height="99" rx="5" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="461" y="150" width="431" height="99" rx="10" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><rect x="312" y="458" width="798" height="99" rx="5" fill="#E7F0FF" stroke="none" stroke-width="2" data-fill-role="pale" /><rect x="569" y="458" width="213" height="99" rx="10" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><rect x="321" y="332" width="286" height="86" rx="10" fill="#FFFFFF" stroke="#2864F0" stroke-width="3" data-fill-role="paper" data-stroke-role="accent" /><path d="M492 265V302H464V318" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="464,333 455,312 473,312" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><path d="M625 266V409H674V438" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="674,458 664,435 684,435" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="197.5" y="149.45">変更前</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="197.5" y="477.45">分けた後</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="676.5" y="208.95">止めて準備・交換・確認</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="675.5" y="516.95">交換・確認</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="25.556" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="464.0" y="383.945">動いている間に準備</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="686.5" y="654.45">停止が必要な仕事と、事前にできる仕事を分ける</tspan></text></g></svg>
