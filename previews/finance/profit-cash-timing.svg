<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">売上を認識する時点と入金の時点を分ける</title><desc id="desc">損益と資金繰りの違いを、身近な取引の時点で説明する。 取引の成果と代金の受け取りは時点が異なり、両方を確認する必要がある。</desc><path d="M342 216L1106 216" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1124,216 1106,207.72 1106,224.28" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><path d="M342 483L1106 483" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><polygon points="1124,483 1106,474.72 1106,491.28" fill="#153A6B" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="ink" /><circle cx="565" cy="216" r="28" fill="#2864F0" stroke="none" stroke-width="2" data-fill-role="accent" /><circle cx="963" cy="483" r="28" fill="#153A6B" stroke="none" stroke-width="2" data-fill-role="ink" /><path d="M565 254L565 516" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" data-stroke-role="mid" /><path d="M963 179L963 446" fill="none" stroke="#79A7ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" data-stroke-role="mid" /><path d="M565 332V351H963V332" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="189.0" y="222.45">売上の認識</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="189.0" y="489.45">現金の動き</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="564.0" y="146.95">提供した時点</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="960.0" y="583.95">代金を受け取る時点</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="764.5" y="412.95">時点がずれる</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="715.0" y="669.45">売上があっても、同じ時点に現金が入るとは限らない</tspan></text></g></svg>
