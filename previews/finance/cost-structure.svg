<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">直接原価と共通費用を分けて原価を読む</title><desc id="desc">製品原価の説明で、直接費と共通費の違いを整理する。 原価の全体を、対象に直接ひも付く費用と共通で支える費用へ分ける。</desc><rect x="71" y="275" width="213" height="156" rx="10" fill="#153A6B" stroke="#153A6B" stroke-width="3" data-fill-role="ink" data-stroke-role="ink" /><path d="M290 353H361V182H451M361 353V518H451" fill="none" stroke="#153A6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="ink" /><rect x="457" y="129" width="235" height="107" rx="10" fill="#E7F0FF" stroke="#2864F0" stroke-width="3" data-fill-role="pale" data-stroke-role="accent" /><rect x="457" y="465" width="235" height="107" rx="10" fill="#F3F7FD" stroke="#153A6B" stroke-width="3" data-fill-role="faint" data-stroke-role="ink" /><path d="M700 182L788 182" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="806,182 788,173.72 788,190.28" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="814" y="116" width="307" height="132" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><path d="M700 518L788 518" fill="none" stroke="#2864F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" data-stroke-role="accent" /><polygon points="806,518 788,509.72 788,526.28" fill="#2864F0" stroke="none" stroke-width="2" stroke-linejoin="round" data-fill-role="accent" /><rect x="814" y="452" width="307" height="132" rx="10" fill="#FFFFFF" stroke="#153A6B" stroke-width="3" data-fill-role="paper" data-stroke-role="ink" /><g data-labels="true"><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#FFFFFF" data-fill-role="paper"><tspan x="177.5" y="362.45">原価の全体</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="574.5" y="191.95">直接ひも付く</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="574.5" y="527.95">共通で支える</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="967.5" y="191.45">材料・加工</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="967.5" y="527.45">設備・支援</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="622.5" y="74.95">製品に直接ひも付く費用と、共通の費用を分ける</tspan></text><text font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, Meiryo, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#153A6B" data-fill-role="ink"><tspan x="941.5" y="366.55">配賦の考え方も</tspan><tspan x="941.5" y="404.35">合わせて確認</tspan></text></g></svg>
