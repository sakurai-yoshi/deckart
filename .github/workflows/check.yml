name: Check library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Validate library (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate assets and export contracts
        shell: bash
        run: |
          python scripts/check_public.py --history
          python scripts/build.py
          python scripts/validate.py
          python -m unittest discover -s tests
      - name: Check reproducible outputs
        shell: bash
        run: |
          python scripts/build.py
          python scripts/validate.py
          git diff --exit-code
